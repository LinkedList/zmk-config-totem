    # Zephyr 3.5). ZMK main has since moved to Zephyr 4.1, which zmk-dongle-screen
    # main does not support yet.
    - name: zmk
      remote: zmkfirmware
      revision: f9be3ed9c08b35b1b86df24c0f04913f3b5e50f5
      import: app/west.yml
    # Fork of janpfischer/zmk-dongle-screen 0.1.2 with the modifier widget fix
    # (branch fix/mod-status-isr)
    - name: zmk-dongle-screen
      remote: linkedlist
      revision: dccbe53f9cb9b0b53386d3e247d4ef648d40c053
  self:
    path: config
