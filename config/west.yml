manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: linkedlist
      url-base: https://github.com/LinkedList
  projects:
    # Fork of ZMK at f9be3ed9 (main as of Nov 2025, Zephyr 3.5) plus a fix that
    # retries split peripheral discovery after encryption, deferred to the system
    # work queue (branch fix/split-discovery-retry). ZMK main has since moved to
    # Zephyr 4.1, which
    # zmk-dongle-screen main does not support yet.
    - name: zmk
      remote: linkedlist
      revision: 40f8ee73aa4f95296b0c2ed59e7d87cdb629a027
      import: app/west.yml
    # Fork of janpfischer/zmk-dongle-screen 0.1.2 with the modifier widget fix
    # (branch fix/mod-status-isr)
    - name: zmk-dongle-screen
      remote: linkedlist
      revision: dccbe53f9cb9b0b53386d3e247d4ef648d40c053
  self:
    path: config
