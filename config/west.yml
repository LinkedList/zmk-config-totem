    - name: zmk
      remote: linkedlist
      revision: e708f45aa6bbae22df66638b6fecf34b7549caa9
      import: app/west.yml
    # Fork of janpfischer/zmk-dongle-screen 0.1.2 with the modifier widget fix
    # (branch fix/mod-status-isr)
    - name: zmk-dongle-screen
      remote: linkedlist
      revision: dccbe53f9cb9b0b53386d3e247d4ef648d40c053
  self:
    path: config
