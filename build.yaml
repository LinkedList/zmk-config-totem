include:
  - board: seeeduino_xiao_ble
    shield: totem_dongle dongle_screen
  - board: seeeduino_xiao_ble
    shield: totem_left
  - board: seeeduino_xiao_ble
    shield: totem_right
  - board: seeeduino_xiao_ble
    shield: settings_reset
  # Debug dongle: same firmware plus logs over USB serial (LVGL errors and
  # per-thread stack usage every 30 s), to catch the dongle hang in the act.
  - board: seeeduino_xiao_ble
    shield: totem_dongle dongle_screen
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_LV_USE_LOG=y -DCONFIG_LV_LOG_PRINTF=y -DCONFIG_THREAD_NAME=y -DCONFIG_THREAD_ANALYZER=y -DCONFIG_THREAD_ANALYZER_USE_LOG=y -DCONFIG_THREAD_ANALYZER_AUTO=y -DCONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30 -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
    artifact-name: totem_dongle-debug
